<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Orçamento</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--acc:#0f766e}
  @media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#ececef;--mute:#9a9aa2;--line:#2e2e33;--acc:#2dd4bf}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:1100px;margin:auto;padding:24px 16px;display:grid;gap:24px;grid-template-columns:1fr}
  @media (min-width:900px){main{grid-template-columns:380px 1fr}}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  h1{font-size:20px;margin:0 0 12px}
  h2{font-size:16px;margin:18px 0 8px}
  label{display:block;font-size:14px;margin:8px 0 2px;color:var(--mute)}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;font:inherit}
  .chk{display:flex;gap:8px;align-items:center;color:var(--ink);margin:6px 0}
  .chk input{width:auto}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{margin-top:14px;padding:10px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
  #doc h1{font-size:24px} #doc table{width:100%;border-collapse:collapse;margin:8px 0}
  #doc td,#doc th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
  #doc td.n,#doc th.n{text-align:right;white-space:nowrap}
  .tot{font-size:22px;font-weight:700}
  .muted{color:var(--mute);font-size:14px}
  @media print{body{background:#fff;color:#000} section:first-child,button{display:none} main{display:block} section{border:0}}
</style>
</head>
<body>
<main>
<section>
  <h1>Gerador de orçamento</h1>
  <label>Cliente</label><input id="cliente" value="Cliente Exemplo">
  <label>Objetivo (palavras do cliente)</label><textarea id="objetivo" rows="2">Receber mais pedidos de orçamento pelo WhatsApp vindos do Instagram.</textarea>
  <div class="row">
    <div><label>Tamanho</label>
      <select id="tam"><option value="curta">Curta</option><option value="media" selected>Média</option><option value="longa">Longa</option></select></div>
    <div><label>Valor-hora (R$)</label><input id="hora" type="number" value="75"></div>
  </div>
  <h2>Escopo</h2>
  <label class="chk"><input type="checkbox" id="copy" checked> Copy completa feita por nós</label>
  <label class="chk"><input type="checkbox" id="designp" checked> Design personalizado</label>
  <label class="chk"><input type="checkbox" id="track" checked> Rastreamento (GA4 + Pixel + GTM)</label>
  <label class="chk"><input type="checkbox" id="capi"> Meta CAPI server-side</label>
  <label class="chk"><input type="checkbox" id="lgpd" checked> LGPD (banner + política)</label>
  <label class="chk"><input type="checkbox" id="ab"> Variante para teste A/B</label>
  <label class="chk"><input type="checkbox" id="pesq"> Pesquisa de voz do cliente</label>
  <div class="row">
    <div><label>Integrações</label><input id="integ" type="number" value="1" min="0"></div>
    <div><label>Rodadas de revisão</label><input id="rev" type="number" value="2" min="1"></div>
  </div>
  <label class="chk"><input type="checkbox" id="urg"> Urgência (+40%)</label>
  <h2>Terceiros e recorrentes</h2>
  <div class="row">
    <div><label>Terceiros (R$, repasse)</label><input id="terc" type="number" value="40"></div>
    <div><label>Manutenção/mês (R$)</label><input id="manut" type="number" value="129"></div>
  </div>
  <h2>Retorno</h2>
  <div class="row">
    <div><label>Ticket médio do cliente (R$)</label><input id="ticket" type="number" value="800"></div>
    <div><label>Margem do cliente (%)</label><input id="margem" type="number" value="40"></div>
  </div>
  <button onclick="gerar()">Gerar</button>
  <button onclick="print()">Imprimir / PDF</button>
</section>
<section id="doc"></section>
</main>
<script>
const H = { // horas médias por etapa [curta, media, longa]
  briefing:[2.5,4,8], estrategia:[1.5,3,5], copy:[3,6.5,13], designBase:[3,5,9], designPers:[2,5,8],
  dev:[5,10,17], integ:[1.5,2.5,3.5], track:[1.5,3,5], capi:[0,4,5], lgpd:[1.5,2.5,2.5],
  seo:[1,2.5,3.5], qa:[1.5,2.5,3.5], rev:[1.2,2,3.2], ab:[3,5,8], pesq:[4,6,10]
};
const GEST=[.08,.10,.12], RISCO=[.10,.12,.15], PRAZO=["5–7","10–15","20–30"];
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const $=id=>document.getElementById(id);
function gerar(){
  const i={curta:0,media:1,longa:2}[$("tam").value], hora=+$("hora").value;
  const it=[];
  const add=(n,h)=>{ if(h>0) it.push([n,h]); };
  add("Briefing, pesquisa e análise de concorrentes",H.briefing[i]);
  add("Estratégia e estrutura (wireframe)",H.estrategia[i]);
  if($("pesq").checked) add("Pesquisa de voz do cliente (avaliações, entrevistas)",H.pesq[i]);
  add($("copy").checked?"Copywriting completo":"Ajuste e revisão de textos fornecidos",$("copy").checked?H.copy[i]:H.copy[i]*.35);
  add("Design visual"+($("designp").checked?" personalizado":" a partir da base"),H.designBase[i]+($("designp").checked?H.designPers[i]:0));
  add("Desenvolvimento responsivo (mobile primeiro)",H.dev[i]);
  const n=+$("integ").value; if(n>0) add(`Formulário/WhatsApp e integrações (${n})`,H.integ[i]*n);
  if($("track").checked) add("Rastreamento: GA4, Meta Pixel, GTM, UTMs, eventos",H.track[i]);
  if($("capi").checked) add("Meta Conversions API server-side",H.capi[i]||3);
  if($("lgpd").checked) add("LGPD: banner de cookies e política de privacidade",H.lgpd[i]);
  add("SEO técnico, Open Graph e performance (Core Web Vitals)",H.seo[i]);
  if($("ab").checked) add("Variante para teste A/B",H.ab[i]);
  add("Testes (QA) e publicação",H.qa[i]);
  add(`Revisões (${$("rev").value} rodada(s))`,H.rev[i]*+$("rev").value);
  let sub=it.reduce((s,x)=>s+x[1],0);
  const gest=sub*GEST[i], risco=(sub+gest)*RISCO[i], horas=sub+gest+risco;
  let proj=Math.ceil(horas*hora/50)*50; if($("urg").checked) proj=Math.ceil(proj*1.4/50)*50;
  const terc=+$("terc").value, total=proj+terc;
  const lucroVenda=+$("ticket").value*+$("margem").value/100;
  const vendas=lucroVenda>0?Math.ceil(total/lucroVenda):"—";
  const val=new Date(Date.now()+15*864e5).toLocaleDateString("pt-BR");
  const pg = total>5000 ? "40% para iniciar, 30% na aprovação do design, 30% na entrega" : "50% para iniciar, 50% na entrega (antes da publicação)";
  $("doc").innerHTML=`
  <h1>Proposta — Landing page para ${esc($("cliente").value)}</h1>
  <p class="muted">Válida até ${val}</p>
  <h2>Objetivo</h2><p>${esc($("objetivo").value)}</p>
  <h2>O que está incluído</h2>
  <table><tr><th>Etapa</th><th class="n">Horas</th></tr>
  ${it.map(x=>`<tr><td>${x[0]}</td><td class="n">${x[1].toFixed(1)}</td></tr>`).join("")}
  <tr><td>Gestão e comunicação</td><td class="n">${gest.toFixed(1)}</td></tr>
  <tr><td>Reserva técnica (imprevistos)</td><td class="n">${risco.toFixed(1)}</td></tr>
  <tr><th>Total estimado</th><th class="n">${horas.toFixed(0)} h</th></tr></table>
  <h2>Investimento</h2>
  <table>
  <tr><td>Projeto${$("urg").checked?" (com prazo de urgência)":""}</td><td class="n">${brl(proj)}</td></tr>
  ${terc?`<tr><td>Custos de terceiros (domínio, ferramentas) — repasse</td><td class="n">${brl(terc)}</td></tr>`:""}
  <tr><td class="tot">Total</td><td class="n tot">${brl(total)}</td></tr>
  ${+$("manut").value?`<tr><td>Opcional: hospedagem + manutenção mensal</td><td class="n">${brl(+$("manut").value)}/mês</td></tr>`:""}
  </table>
  <p>Prazo: <b>${PRAZO[i]} dias úteis</b> após o recebimento dos materiais.</p>
  <h2>Retorno</h2>
  <p>Com ticket de ${brl(+$("ticket").value)} e margem de ${$("margem").value}%, cerca de <b>${vendas} venda(s)</b> pagam a página. Não garantimos taxa de conversão (ela depende do tráfego, da oferta e do atendimento); garantimos entrega técnica, boas práticas e medição de resultados.</p>
  <h2>Condições</h2>
  <ul>
    <li>Pagamento: ${pg}. Pix, boleto ou cartão (taxa do cartão repassada).</li>
    <li>Revisões incluídas: ${$("rev").value}. Mudança de escopo = novo orçamento.</li>
    <li>Após a quitação, código e conteúdo pertencem ao cliente; domínio e contas no nome do cliente.</li>
    <li>Fora do escopo: gestão de tráfego pago, produção de fotos/vídeos, parecer jurídico, integrações não listadas.</li>
  </ul>
  <h2>Próximo passo</h2><p>Aprovar esta proposta e pagar a entrada. O briefing acontece na mesma semana.</p>`;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
gerar();
</script>
</body>
</html>
